# Staging overlay — "ACMS Agent" working copy.
#
# Identical to docker-compose.prod.yml except the compose project name, so every
# container, network and volume gets an `acms-agent` prefix and nothing is shared
# with the live `acms` stack. Postgres and MinIO stay unpublished.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.agent.yml --env-file ../.env up -d --build
name: acms-agent

services:
  api:
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-4010}:4000"

  web:
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-3110}:3000"
