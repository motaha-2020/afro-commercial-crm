# Production override for the shared Afro server.
#
# The box already runs supabase (incl. a Postgres on 5432), n8n, open-webui and
# more. ACMS must not touch any of it, so this override:
#   - keeps Postgres and MinIO UNPUBLISHED — only ACMS's own containers reach
#     them over the private `acms` compose network, nothing binds a host port.
#   - publishes only web and api, on host ports chosen to be free.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
name: acms

services:
  postgres:
    # Drop the host port binding inherited from the base file. `[]` replaces the
    # base `ports` list rather than appending to it.
    ports: []

  minio:
    ports: []

  # Both are bound to the Tailscale IP specifically, so they are reachable over
  # the private tailnet but not exposed on any public interface the box may have.
  api:
    ports:
      - '${BIND_IP:-127.0.0.1}:${API_PORT:-4000}:4000'

  web:
    ports:
      - '${BIND_IP:-127.0.0.1}:${WEB_PORT:-3100}:3000'
